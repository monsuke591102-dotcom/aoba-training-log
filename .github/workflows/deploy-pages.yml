name: Deploy AOBA TRAINING LOG to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      release_mode:
        description: 'Build mode for the pinned release commit'
        required: true
        default: enabled
        type: choice
        options:
          - enabled
          - compatibility
      expected_sha:
        description: 'Full SHA of the approved release commit'
        required: true
        type: string

concurrency:
  group: github-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    defaults:
      run:
        working-directory: aoba-training-log
    steps:
      - name: Verify approved commit and build mode
        shell: bash
        working-directory: .
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RELEASE_MODE: ${{ inputs.release_mode }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_SHA" == "$GITHUB_SHA" ]]
          [[ "$RELEASE_MODE" == enabled || "$RELEASE_MODE" == compatibility ]]
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
        id: pages
      - uses: pnpm/setup@v3
        with:
          working-directory: aoba-training-log
          runtime: node@24
          require-lockfile: true
      - run: pnpm test
      - run: pnpm build
        env:
          VITE_STRIKEOUT_CLASSIFICATION: ${{ inputs.release_mode }}
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: aoba-training-log/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
